services:
  - type: web
    name: smart-water-backend
    env: node
    plan: free
    buildCommand: npm ci --include=dev && npm run build && python3 -m pip install -r requirements.txt
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PYTHON_BIN
        value: python3
      - key: MQTT_ENABLED
        value: "false"
      - key: MONGO_URI
        sync: false
      - key: MONGO_DB_NAME
        value: main
      - key: JWT_ACCESS_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: GOOGLE_WEB_CLIENT_ID
        sync: false
      - key: GOOGLE_ANDROID_CLIENT_ID
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: llama-3.3-70b-versatile
      - key: CORS_ORIGINS
        sync: false
      - key: MQTT_URL
        sync: false
      - key: MQTT_USERNAME
        sync: false
      - key: MQTT_PASSWORD
        sync: false
      - key: APP_LATEST_VERSION
        value: "4"
      - key: APP_LATEST_VERSION_NAME
        value: "1.3"
      - key: APP_APK_URL
        sync: false
      - key: APP_FORCE_UPGRADE
        value: "false"
